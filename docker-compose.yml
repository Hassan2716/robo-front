version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: robocutz-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=robocutz

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: robocutz-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/robocutz
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_EXPIRE=7d
      - JWT_COOKIE_EXPIRE=7
      - CLIENT_URL=http://localhost:5173
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_SECURE=false
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=noreply@robocutz.com
      - CONTACT_EMAIL=info@robocutz.com
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: robocutz-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data: